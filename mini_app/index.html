<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>PM2.5 Predictor</title>

  <style>
    .center-form {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      padding-left: 10px;
    }

    header {
      font-size: 25px;
    }

    div {
      padding-left: 2%;
    }

    .submit-button {
      display: block;
      margin: 0 auto;
    }

    .center-text {
      text-align: center;
    }
  </style>

</head>

<body>

  <header>
    <h2 style="text-align: center; background-color: #505050; color: white; padding: 40px;">
      Predictor de Nivel de Contaminación del Aire
    </h2>
    <h4 style="text-align: center;">
      Ingrese los datos temporales para predecir el nivel de contaminación en el aire:
    </h4>
  </header>

  <!-- Formulario corregido -->
  <form id='myDialog' method="POST" action="/" class="center-form">
    <div>
      <label for="year">Año:</label> <br>
      <input type="number" id="year" name="year" value="2024" min="2000" max="2030"><br><br>

      <label for="month">Mes:</label> <br>
      <input type="number" id="month" name="month" value="1" min="1" max="12"><br><br>

      <label for="day">Día:</label> <br>
      <input type="number" id="day" name="day" value="1" min="1" max="31"><br><br>

      <label for="hour">Hora:</label> <br>
      <input type="number" id="hour" name="hour" value="0" min="0" max="23"><br><br>

      <!-- Botón corregido -->
      <input class="submit-button" type="submit" value="Predecir"> <br><br>
    </div>

    <!-- Mostrar la predicción en la misma página -->
    {% if prediccion %}
    <div class="center-text">
      <br>
      <p><strong> Nivel de contaminación:</strong></p>
      <p> {{ prediccion }} </p>
    </div>
    {% endif %}

  </form>

</body>

</html>
